name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python ${{ matrix.python }} --group dev ruff format --check
      - run: uv run --python ${{ matrix.python }} --group dev ruff check
      - run: uv run --python ${{ matrix.python }} --group dev ty check src tests
      - run: uv run --python ${{ matrix.python }} --group dev pytest
